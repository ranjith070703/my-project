name: Local Minikube CI/CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: self-hosted   # Runs on your local laptop runner

    steps:
    # Step 1: Checkout the latest code
    - name: Checkout repository
      uses: actions/checkout@v3

    # Step 2: Start Minikube safely
    - name: Start Minikube
      shell: powershell
      run: |
        Write-Host "Checking if Minikube is running..."
        $status = minikube status | Select-String "Running" -ErrorAction SilentlyContinue
        if ($status) {
          Write-Host " Minikube already running."
        } else {
          Write-Host " Starting Minikube as Administrator..."
          $command = 'minikube start --driver=docker'
          Start-Process -FilePath "powershell.exe" -Verb RunAs -ArgumentList $command -WindowStyle Hidden
          Start-Sleep -Seconds 60
        }
        Write-Host "Checking Minikube status..."
        minikube status

    # Step 3: Configure Docker to use Minikube’s Docker daemon
    - name: Point Docker to Minikube
      shell: powershell
      run: |
        Write-Host " Setting Docker environment to Minikube..."
        minikube -p minikube docker-env --shell powershell | Invoke-Expression

    # Step 4: Build Backend Image
    - name: Build backend image
      shell: powershell
      run: |
        Write-Host "🔨 Building backend Docker image..."
        docker build -t backend:latest ./backend

    # Step 5: Build Frontend Image
    - name: Build frontend image
      shell: powershell
      run: |
        Write-Host " Building frontend Docker image..."
        docker build -t frontend:latest ./frontend

    # Step 6: Deploy to Kubernetes
    - name: Deploy to Kubernetes
      shell: powershell
      run: |
        Write-Host " Deploying to Kubernetes..."
        $env:KUBECONFIG = "$(minikube kubeconfig)"
        kubectl apply -f fullstack-deployment.yaml --validate=false
        kubectl rollout status deployment/backend-deployment
        kubectl rollout status deployment/frontend-deployment

    # Step 7: Verify Deployment (non-interactive service URL listing)
    - name: Verify Deployment
      shell: powershell
      run: |
        Write-Host " Verifying running pods and services..."
        kubectl get pods
        kubectl get svc

        Write-Host "`n Listing Minikube services..."
        minikube service list

        Write-Host "`n Deployment completed successfully. Pipeline finished."
        Start-Sleep -Seconds 10
